# SMC under https://tatv.dewin.in/smc/, inside the EXISTING tatv.dewin.in site:
# no new DNS record, no new certificate, no new site. Install (needs sudo, once):
#
#   sudo cp deploy/gpu/nginx-smc-location.conf /etc/nginx/snippets/smc-locations.conf
#   # in /etc/nginx/sites-available/tatv, inside the tatv.dewin.in server block that
#   # listens on 443 (the one certbot manages), add this one line:
#   #     include snippets/smc-locations.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Everything else in the site is untouched: Deco Vision keeps /, /api/, /ws/ and
# /assets/. Every location here starts with /smc/ and uses ^~, so no other
# location (including regex ones) can take these requests. The site's access log
# format (tatv_redacted, $uri only) keeps WebSocket tokens out of the log.
#
# SMC's backend runs as smc.service on 127.0.0.1:18821 (deploy/gpu/smc.service).
# nginx (www-data) must be able to read the frontend, as for tatv:
# chmod o+x /home/kanishka /home/kanishka/smc.

location = /smc { return 301 /smc/; }

# The SMC frontend (built with VITE_BASE_PATH=/smc/). Hashed files cache for a year.
location ^~ /smc/assets/ {
    alias /home/kanishka/smc/current/frontend/dist/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# SMC's API: /smc/api/... -> the backend's /api/...
location ^~ /smc/api/ {
    proxy_pass http://127.0.0.1:18821/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Face enrolment and photo uploads (the backend caps a picture at 5 MB).
    client_max_body_size 12m;
    # Clip downloads and report exports can take a while.
    proxy_read_timeout 300s;
    proxy_buffering off;
}

# Live video, detections and staff count: /smc/ws/... -> the backend's /ws/...
location ^~ /smc/ws/ {
    proxy_pass http://127.0.0.1:18821/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1h;
    proxy_buffering off;
}

# Every other /smc/ path is the single-page app (its router handles /smc/login,
# /smc/sso, /smc/dashboard, ...).
location ^~ /smc/ {
    alias /home/kanishka/smc/current/frontend/dist/;
    try_files $uri $uri/ /smc/index.html;
}
