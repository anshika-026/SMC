# /etc/nginx/sites-available/smc  (symlinked into sites-enabled)
#
# SMC on the shared DeWIN GPU server, next to Deco Vision's tatv sites. This file
# only ADDS one named host; it does not touch the other sites. Every name below is
# prefixed smc_ so nothing collides with other configs in the http {} context.
#
# SMC needs its own hostname (not a path under tatv.dewin.in): SMC and Deco Vision
# keep their browser sessions under the same localStorage keys, so on one origin
# they would overwrite each other's logins.
#
# Install (needs sudo, once; DNS A record smc.dewin.in -> this server first):
#   sudo cp deploy/gpu/nginx-smc.conf /etc/nginx/sites-available/smc
#   sudo ln -s /etc/nginx/sites-available/smc /etc/nginx/sites-enabled/smc
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d smc.dewin.in        # adds 443 + the http->https redirect
#
# Deploys never reload nginx: the root below is a symlink each deploy switches.
#
# nginx (www-data) must be able to read the frontend: same requirement as tatv,
# e.g. chmod o+x on /home/kanishka and /home/kanishka/smc.

log_format smc_redacted '$remote_addr - [$time_local] "$host" "$request_method $uri" $status $body_bytes_sent $request_time';

upstream smc_backend { server 127.0.0.1:18821; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name smc.dewin.in;

    root /home/kanishka/smc/current/frontend/dist;
    index index.html;

    # $uri, not $request_uri: the WebSocket token travels in ?token= and must not
    # be written to disk.
    access_log /var/log/nginx/smc.access.log smc_redacted;
    error_log  /var/log/nginx/smc.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # Face enrolment and photo uploads: the backend caps a picture at MAX_UPLOAD_MB (5).
    client_max_body_size 12m;

    location / { try_files $uri /index.html; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    location /api/ {
        proxy_pass http://smc_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Clip downloads and report exports can take a while.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Live video, detections and staff count.
    location /ws/ {
        proxy_pass http://smc_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    # Health and readiness (licence state included) stay on the server.
    location ~ ^/(health|ready)$ { allow 127.0.0.1; deny all; proxy_pass http://smc_backend; }
}
